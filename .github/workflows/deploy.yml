name: Deploy to AWS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            cd /home/ubuntu/formbuilder
            
            # Force sync with remote (handles local changes / merge conflicts)
            git fetch origin
            git reset --hard origin/main
            git clean -fd
            
            # Install dependencies
            npm install
            
            # Build the app
            npm run build
            
            # Verify ecosystem.config.cjs exists
            if [ ! -f ecosystem.config.cjs ]; then
              echo "ERROR: ecosystem.config.cjs not found after git pull!"
              ls -la
              exit 1
            fi
            
            # Reload PM2 with the ecosystem config
            pm2 reload ecosystem.config.cjs || pm2 start ecosystem.config.cjs
            
            # Reload nginx
            sudo systemctl reload nginx
            
            echo "Deployment completed successfully!"