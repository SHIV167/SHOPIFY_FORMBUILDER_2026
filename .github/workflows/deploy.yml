name: Deploy to AWS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            # Fix git safe.directory and ownership issues
            sudo git config --global --add safe.directory /home/ubuntu/formbuilder
            
            # Fix ownership - change all files from root to ubuntu
            sudo chown -R ubuntu:ubuntu /home/ubuntu/formbuilder
            
            cd /home/ubuntu/formbuilder
            
            # Force sync with remote
            git fetch origin
            git reset --hard origin/main
            git clean -fd
            
            # Install dependencies
            npm install
            
            # Build the app
            npm run build
            
            # Clean up old errored PM2 process if exists
            pm2 delete contactform-builder 2>/dev/null || true
            
            # Verify ecosystem.config.cjs exists
            if [ ! -f ecosystem.config.cjs ]; then
              echo "ERROR: ecosystem.config.cjs not found!"
              ls -la
              exit 1
            fi
            
            # Stop existing formbuilderapp if running, then start with ecosystem config
            pm2 delete formbuilderapp 2>/dev/null || true
            pm2 start ecosystem.config.cjs
            pm2 save
            
            # Reload nginx
            sudo systemctl reload nginx
            
            # Show PM2 status
            pm2 status
            
            echo "Deployment completed successfully!"