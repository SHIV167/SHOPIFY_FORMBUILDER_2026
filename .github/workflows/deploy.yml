name: Deploy to AWS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            # Fix git safe.directory and ownership issues
            sudo git config --global --add safe.directory /home/ubuntu/formbuilder
            
            # Fix ownership - change all files from root to ubuntu
            sudo chown -R ubuntu:ubuntu /home/ubuntu/formbuilder
            
            cd /home/ubuntu/formbuilder
            
            # Force sync with remote
            git fetch origin
            git reset --hard origin/main
            git clean -fd
            
            # Install dependencies
            npm install
            
            # Clean build artifacts
            rm -rf .next
            
            # Build the app
            npm run build
            
            # Clean up old errored PM2 process if exists
            pm2 delete contactform-builder 2>/dev/null || true
            
            # Stop existing formbuilderapp if running, then start with npm
            pm2 delete formbuilderapp 2>/dev/null || true
            PORT=3006 pm2 start npm --name "formbuilderapp" -- start
            pm2 save
            
            # Copy nginx configuration
            sudo cp /home/ubuntu/formbuilder/nginx.conf /etc/nginx/sites-available/formbuilder
            sudo ln -sf /etc/nginx/sites-available/formbuilder /etc/nginx/sites-enabled/
            
            # Test nginx configuration
            sudo nginx -t
            
            # Reload nginx
            sudo systemctl reload nginx
            
            # Show PM2 status
            pm2 status
            
            echo "Deployment completed successfully!"