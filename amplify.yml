version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - npx prisma generate
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: Access-Control-Allow-Origin
          value: '*'
        - key: Access-Control-Allow-Methods
          value: 'GET, POST, PUT, DELETE, OPTIONS'
        - key: Access-Control-Allow-Headers
          value: 'Content-Type, Authorization'
